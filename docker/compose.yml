name: auth-web-community

# 运行时定义（无 build）。远程部署只需本文件（需先 docker login）。
#
#   export IMAGE_PREFIX=ghcr.io/<your-org>
#   export IMAGE_TAG=latest
#   docker compose pull && docker compose up -d --no-build
#
# 本地构建使用同目录 compose.override.yml（docker compose up --build）。

services:
  auth-web-community:
    image: ${IMAGE_PREFIX:-auth}/auth-web-community:${IMAGE_TAG:-local}
    container_name: auth-web-community
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      TZ: Asia/Shanghai
      GATEWAY_HOST: ${GATEWAY_HOST:-auth-gateway}
    ports:
      - "18080:80"
    restart: unless-stopped
    networks:
      - auth-network

networks:
  auth-network:
    external: true
