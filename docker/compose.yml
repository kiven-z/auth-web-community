name: auth-web-community

# 运行时定义（无 build）。本地默认 tag=local；远程部署复制 docker/.env.example 为 docker/.env 或 export：
#
#   export IMAGE_PREFIX=registry.cn-hangzhou.aliyuncs.com/kiven-z-auth
#   export IMAGE_TAG=community-latest
#   docker compose pull && docker compose up -d --no-build
#
services:
  auth-web:
    image: ${IMAGE_PREFIX:-auth}/auth-web:${IMAGE_TAG:-local}
    container_name: auth-web
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      TZ: Asia/Shanghai
      GATEWAY_HOST: auth-gateway
    ports:
      - "18080:80"
    restart: unless-stopped
    networks:
      - auth-network

networks:
  auth-network:
    external: true
