sonar.projectKey=auth-web-community
sonar.projectName=auth-web-community
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8

# 无分析价值：依赖产物 / 生成物 / 静态资源
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,mock/**,src/assets/**,src/style/tailwind.css

# 字段声明型样板：只跳过 CPD（对齐后端 Entity/DTO），仍参与规则扫描
sonar.cpd.exclusions=**/*Columns.tsx,**/*Columns.ts,**/columns/**,**/auditColumns.tsx
