# auth-web-community/pnpm-workspace.yaml
# 单包项目也可只用此文件承载 pnpm 配置（pnpm 10.26+ / 11）

shamefullyHoist: true
shellEmulator: true
enablePrePostScripts: false
strictPeerDependencies: false

allowedDeprecatedVersions:
  are-we-there-yet: "*"
  sourcemap-codec: "*"
  lodash.isequal: "*"
  domexception: "*"
  w3c-hr-time: "*"
  inflight: "*"
  npmlog: "*"
  rimraf: "*"
  stable: "*"
  gauge: "*"
  abab: "*"
  glob: "*"

allowBuilds:
  "@parcel/watcher": true
  core-js: true
  es5-ext: true
  esbuild: true
  typeit: true
  vue-demi: true
  "@tailwindcss/oxide": false
